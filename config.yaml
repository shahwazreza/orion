# ORION configuration.
#
# Settings are resolved as:  common  <-  profiles.<active>  <-  CLI / env overrides.
# A profile only needs the keys that differ from `common`.
#
# Profile selection:
#   active_profile: auto  -> first profile whose `detect` rule matches this machine,
#                            otherwise `default_profile`.
#   ORION_PROFILE=jetson or `python main.py --profile jetson` overrides it.
#
# To add a device (e.g. a 16GB Orin NX), copy the `jetson` block, give it a more
# specific detect rule, and put it ABOVE `jetson` so it matches first.
#
# Relative paths are relative to this file's directory.

active_profile: auto
default_profile: laptop

common:
  assistant:
    name: Orion             # users are learned at first start, not configured here
    profanity: "on"         # "on": swears back casually, mirroring you; "off": always clean.
                            # Quoted because YAML reads bare on/off as true/false.

  paths:
    models: models
    data: data          # encrypted personal data (users, training notes); key in the keyring
    logs: logs

  audio:
    sample_rate: 16000      # mic rate; wake word, VAD, and Whisper all expect 16 kHz
    chunk_ms: 80            # openWakeWord is tuned for 80 ms frames
    input_device: null      # null = system default; name substring or index otherwise
    output_device: null
    chimes: true            # audible cue when Orion starts/stops recording you

  wakeword:
    # Built-in names or paths to custom .onnx models; any of them wakes Orion.
    # hey_orion was trained with notebooks/train_hey_orion.ipynb (docs/wake-word.md).
    # To keep "hey jarvis" as a backup: [models/openwakeword/hey_orion.onnx, hey_jarvis]
    models: [models/openwakeword/hey_orion.onnx]
    phrase: hey orion       # what Orion tells people to say
    threshold: 0.5
    # Synthetic check (2026-10-29): "hey orion" 0.04-0.95 across voices; closest
    # sound-alike "hey brian" 0.46. Tune from: python scripts/wakeword_test.py
    thresholds: {hey_orion: 0.5}
    cooldown_s: 1.5         # ignore re-triggers right after a detection

  conversation:
    follow_up_s: 10.0       # after a reply, listen this long without the wake word; 0 = off
    barge_in: wake_word     # interrupt Orion while he talks: wake_word ("hey jarvis") | voice | off.
                            # voice (just talk over him) needs echo cancellation; through laptop
                            # speakers his echo and room noise set it off (measured 2026-10-28).
    barge_in_echo_threshold: 0.5   # voice closer than this to Orion's own = his echo, ignored
    barge_in_speech_ms: 400        # this much continuous speech counts as an interruption

  people:
    enabled: true
    model: nemo_en_titanet_small.onnx   # speaker embeddings, ~30 ms per utterance on CPU
    threads: 2
    # Measured on 40 LibriSpeech speakers with noisy, partly far-field commands: your own
    # voice often scores only 0.4-0.55 away from enrollment conditions, so 0.55 missed
    # about 30% of commands; 0.40 misses about 8%. Strangers pass 0.40 for a given
    # enrolled person about 1.4% of the time (vs 0.2% at 0.55).
    threshold: 0.40         # min cosine similarity to recognise someone; raise if it mixes people up
    margin: 0.05            # best match must beat the runner-up by this much
    verify_threshold: 0.55  # stricter match needed for anything that changes who Orion trusts:
                            # adding/deleting people, relearning or renaming. At 0.40 about 1
                            # stranger in 100 passes as someone (scripts/voice_eval.py).
    min_audio_s: 0.8        # shorter clips are too short to judge
    continuity_slack: 0.1   # in a follow-up, keep the current speaker down to threshold - slack
    adapt_threshold: 0.72   # confident matches refine the voiceprint over time; lower lets
                            # strangers' voices leak in (0.50 doubled false matches in tests)
    adapt_min_audio_s: 2.0  # seconds of audio needed to learn from a match
    enroll_target_s: 10.0   # seconds of speech collected when learning a voice

  vad:
    threshold: 0.5
    start_timeout_s: 6.0    # give up if no speech starts after the wake word
    neg_threshold: 0.35     # once speaking, frames above this still count as speech (hysteresis)
    # Pauses mid-sentence cut people off. Measured on noisy, far-field LibriSpeech:
    # 800 ms (no hysteresis) cut 29% of sentences short, 1000 ms 12%, 1200 ms 6%.
    # Each extra 200 ms is added to every reply's start. Lower it in a quiet room.
    # 5 s lets you pause to think mid-sentence; Orion waits that long after you
    # stop before answering.
    end_silence_ms: 5000    # this much silence ends the utterance
    max_utterance_s: 60.0   # longest single recording
    pre_roll_ms: 240        # audio kept from just before speech onset

  stt:
    backend: faster_whisper
    model: small.en
    device: auto            # auto | cpu | cuda
    compute_type: auto      # auto -> int8 on CPU, float16 on CUDA
    language: en
    beam_size: 1            # greedy decoding: much faster, small accuracy cost
    cpu_threads: 0          # 0 = library default
    hotwords: []            # extra words Whisper should expect (Orion, Claude and known people's
                            # names are added automatically), e.g. [Moffitt, USF]

  llm:
    backend: ollama
    host: http://127.0.0.1:11434   # must be loopback; Orion refuses anything else
    model: llama3.2:3b
    temperature: 0.6
    num_ctx: 4096
    keep_alive: 30m         # keep the model resident between requests
    think: null             # null = don't send; set false for reasoning models (qwen3)
    max_history_turns: 8    # per person, in memory only; chat history is never written to disk
    timeout_s: 90

  tts:
    backend: kokoro         # kokoro (natural, ~2.5 s slower to start on laptop CPU) | piper (fast, robotic)
    use_cuda: auto          # auto -> only if onnxruntime has the CUDA provider
    kokoro:
      model: kokoro-v1.0.onnx   # int8 variant (kokoro-v1.0.int8.onnx) is 3.5x smaller, same speed on this CPU
      voice: bm_george          # British male: bm_george, bm_lewis, bm_daniel, bm_fable
      lang: en-gb
      speed: 1.0
      threads: 4
    piper:
      voice: en_GB-alan-medium  # also downloaded: en_GB-northern_english_male-medium, en_GB-semaine-medium
      speaker_id: null      # multi-speaker voices only, e.g. semaine: 1 = spike, 2 = obadiah
      length_scale: 1.0     # >1 slower speech, <1 faster

  cloud:                    # Claude mode (only when you ask: "ask Claude...", "switch to Claude mode")
    enabled: true
    model: claude-opus-5-5
    effort: low             # short spoken replies; Opus 5.5 always thinks, effort sets how much
    max_tokens: 4096        # includes thinking
    fallbacks: true         # server-side refusal fallbacks (a declined request is retried)
    timeout_s: 60
  search:                   # web search when Orion needs current or unknown information
    enabled: true           # false = offline mode (or say "Orion, don't search")
    backend: searxng        # searxng (local container: scripts/searxng.sh start) | brave
    searxng_url: http://127.0.0.1:8888   # must be loopback
    max_rounds: 3           # search -> read -> search again, at most this many times
    page_chars: 2500        # text kept from each page read (fits the local model)
    cache_s: 900            # repeat searches within 15 minutes use the cached results
  outlook:                  # Phase 3: Outlook mail and calendar, read-only (Microsoft Graph)
    enabled: true
    client_id: null         # your app registration's Application (client) ID (not a secret);
                            # setup steps: user manual, "Outlook mail and calendar"
    tenant: common          # common = personal and work/school accounts | consumers | organizations | tenant ID
    strict_voice: false     # true: every Outlook request needs the strong voice match (people.verify_threshold)
    save_replies: false     # false: the conversation log keeps "(answered from Outlook)", not what was read out
    timeout_s: 15
  router:
    auto: false             # true: plain general-knowledge questions with nothing personal go to Claude

  memory:
    enabled: true           # "remember that..." facts, per person, encrypted, never expire
  conversations:
    enabled: true           # every exchange saved per person (encrypted); strangers never
    keep_days: null         # null = keep forever; e.g. 365 to delete older conversations
  rules:
    enabled: true           # "whenever X, do Y" standing instructions, per person
  embeddings:
    model: nomic-embed-text # local, via Ollama; matches memories/conversations/rules by meaning
  backups:
    keep: 30                # daily encrypted backups of data/orion.db

  training_notes:
    enabled: false          # opt-in: "that was wrong" logs the failure type and an optional
                            # short note (encrypted). Never questions, replies, or personal data.

  metrics:
    enabled: true           # timings + memory only; never transcript text
    file: logs/metrics.enc  # encrypted; read with: python main.py metrics [N]

# Applied on top of everything with --demo (or ORION_DEMO=1), for IT demos and
# interviews. Demo mode always keeps language clean, whatever is set here.
demo:
  conversation:
    follow_up_s: 8.0        # a little more patience while explaining things to people

profiles:
  # Orin NX 16GB example (uncomment and adjust when you have one):
  # orin_nx_16gb:
  #   detect: {device_tree_model_contains: "Orin NX"}
  #   llm: {model: llama3.1:8b}

  jetson:
    detect:
      device_tree_model_contains: "Jetson"
    stt:
      model: small.en
      device: cuda
      compute_type: float16
    llm:
      model: qwen3:4b
      think: false
      num_ctx: 4096
    tts:
      use_cuda: auto

  laptop:
    stt:
      model: medium.en      # ~4.6 s/utterance vs 1.5 s for small.en, ~25% fewer errors in noise
                            # (docs/benchmarks.md, Whisper sizes). small.en if speed matters more.
      device: cpu
      compute_type: int8
      cpu_threads: 4
    llm:
      model: llama3.2:3b
